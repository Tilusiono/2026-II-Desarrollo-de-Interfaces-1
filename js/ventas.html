<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>MiniMarket - Gestión de Ventas</title>

  <link rel="stylesheet" href="css/estilos.css">
</head>

<body>

  <!-- BARRA DE NAVEGACIÓN -->
  <header class="navbar simple">

    <a href="index.html" class="logo">
      🛒 MiniMarket
    </a>

    <div class="nav-links">

      <a href="index.html">
        Inicio
      </a>

      <a href="productos.html">
        Productos
      </a>

      <a href="clientes.html">
        Clientes
      </a>

      <a href="ventas.html" class="active">
        Ventas
      </a>

    </div>

  </header>


  <main class="container">

    <!-- TÍTULO -->
    <div class="page-title">

      <h1>
        Gestión de Ventas
      </h1>

      <p>
        Registra y administra las ventas realizadas
        en el Mini Market.
      </p>

    </div>


    <!-- MENSAJES -->
    <div id="mensaje" class="mensaje"></div>


    <!-- FORMULARIO DE VENTA -->
    <section class="form-card">

      <h2>
        Registrar Nueva Venta
      </h2>

      <form id="formVenta">

        <div class="form-grid">


          <!-- CLIENTE -->
          <div>

            <label for="id_cliente">
              Cliente
            </label>

            <select id="id_cliente" required>

              <option value="">
                Seleccione un cliente
              </option>

            </select>

          </div>


          <!-- PRODUCTO -->
          <div>

            <label for="id_producto">
              Producto
            </label>

            <select id="id_producto" required>

              <option value="">
                Seleccione un producto
              </option>

            </select>

          </div>


          <!-- CANTIDAD -->
          <div>

            <label for="cantidad">
              Cantidad
            </label>

            <input
              type="number"
              id="cantidad"
              min="1"
              required
              placeholder="Ej. 2">

          </div>


        </div>


        <button type="submit" class="btn">
          Registrar Venta
        </button>

      </form>

    </section>


    <!-- TABLA DE VENTAS -->
    <section class="table-card">

      <h2>
        Ventas Registradas
      </h2>

      <div class="table-wrap">

        <table>

          <thead>

            <tr>

              <th>ID</th>
              <th>Cliente</th>
              <th>Producto</th>
              <th>Cantidad</th>
              <th>Total</th>
              <th>Estado</th>
              <th>Acciones</th>

            </tr>

          </thead>


          <tbody id="tablaVentas">

          </tbody>

        </table>

      </div>

    </section>

  </main>


  <footer>
    MiniMarket · Proyecto académico
  </footer>


  <!-- JAVASCRIPT -->
  <script src="./js/app.js"></script>

</body>

</html>
