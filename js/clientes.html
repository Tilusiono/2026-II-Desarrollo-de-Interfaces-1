<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>MiniMarket - Gestión de Clientes</title>

  <link rel="stylesheet" href="css/estilos.css">
</head>

<body>

  <!-- BARRA DE NAVEGACIÓN -->
  <header class="navbar simple">

    <a href="index.html" class="logo">
      🛒 MiniMarket
    </a>

    <div class="nav-links">

      <a href="index.html">
        Inicio
      </a>

      <a href="productos.html">
        Productos
      </a>

      <a href="clientes.html" class="active">
        Clientes
      </a>

      <a href="ventas.html">
        Ventas
      </a>

    </div>

  </header>


  <main class="container">

    <!-- TÍTULO -->
    <div class="page-title">

      <h1>
        Gestión de Clientes
      </h1>

      <p>
        Registra y administra los clientes del Mini Market.
      </p>

    </div>


    <!-- MENSAJES -->
    <div id="mensaje" class="mensaje"></div>


    <!-- FORMULARIO -->
    <section class="form-card">

      <h2>
        Registrar Nuevo Cliente
      </h2>

      <form id="formCliente">

        <div class="form-grid">

          <!-- NOMBRE -->
          <div>

            <label for="nombre_cliente">
              Nombre del cliente
            </label>

            <input
              type="text"
              id="nombre_cliente"
              required
              placeholder="Ej. Juan Pérez">

          </div>


          <!-- DNI -->
          <div>

            <label for="dni">
              DNI
            </label>

            <input
              type="text"
              id="dni"
              maxlength="8"
              required
              placeholder="Ej. 74851236">

          </div>


          <!-- TELÉFONO -->
          <div>

            <label for="telefono">
              Teléfono
            </label>

            <input
              type="text"
              id="telefono"
              placeholder="Ej. 987654321">

          </div>


          <!-- CORREO -->
          <div>

            <label for="correo">
              Correo electrónico
            </label>

            <input
              type="email"
              id="correo"
              placeholder="Ej. cliente@gmail.com">

          </div>

        </div>


        <button type="submit" class="btn">
          Guardar Cliente
        </button>

      </form>

    </section>


    <!-- TABLA DE CLIENTES -->
    <section class="table-card">

      <h2>
        Clientes Registrados
      </h2>

      <div class="table-wrap">

        <table>

          <thead>

            <tr>

              <th>ID</th>
              <th>Nombre</th>
              <th>DNI</th>
              <th>Teléfono</th>
              <th>Correo</th>
              <th>Acciones</th>

            </tr>

          </thead>


          <tbody id="tablaClientes">

          </tbody>

        </table>

      </div>

    </section>

  </main>


  <footer>
    MiniMarket · Proyecto académico
  </footer>


  <!-- JAVASCRIPT -->
  <script src="./js/app.js"></script>

</body>

</html>
