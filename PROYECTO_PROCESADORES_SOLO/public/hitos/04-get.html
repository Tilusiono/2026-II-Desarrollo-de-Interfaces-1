<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Listar componentes</title>
    <link rel="stylesheet" href="/bootstrap/css/bootstrap.min.css" />
    <link rel="stylesheet" href="/bootstrap-icons/font/bootstrap-icons.css" />
  </head>
  <body class="bg-light">
    <nav class="navbar navbar-dark bg-primary">
      <div class="container">
        <span class="navbar-brand">
          <i class="bi bi-download me-2"></i>Listar componentes
        </span>
      </div>
    </nav>

    <main class="container py-4">
      <div id="mensaje" class="alert d-none" role="alert"></div>

      <section class="card border-0 shadow-sm mb-4">
        <div class="card-body p-4">
          <h1 class="h4">Probar las dos rutas GET</h1>
          <div class="row g-3 align-items-end">
            <div class="col-md-4">
              <button id="btn-listar" class="btn btn-primary w-100">
                <i class="bi bi-list-ul me-1"></i>GET: listar todos
              </button>
            </div>
            <div class="col-md-4">
              <label class="form-label" for="componente-id"
                >ID del componente</label
              >
              <input
                id="componente-id"
                type="number"
                min="1"
                value="1"
                class="form-control"
              />
            </div>
            <div class="col-md-4">
              <button id="btn-obtener" class="btn btn-outline-primary w-100">
                <i class="bi bi-search me-1"></i>GET: obtener por ID
              </button>
            </div>
          </div>
        </div>
      </section>

      <section class="card border-0 shadow-sm">
        <div class="card-body p-4">
          <div class="d-flex justify-content-between align-items-center mb-3">
            <h2 class="h5 mb-0">Resultado</h2>
            <span id="total" class="badge text-bg-secondary"
              >0 componentes</span
            >
          </div>
          <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
              <thead>
                <tr>
                  <th>ID</th>
                  <th>Código</th>
                  <th>Modelo</th>
                  <th>Arquitectura</th>
                  <th>Núcleos</th>
                  <th>Precio</th>
                  <th>Estado</th>
                </tr>
              </thead>
              <tbody id="tabla-componentes">
                <tr>
                  <td colspan="7" class="text-center text-secondary py-4">
                    Ejecuta una consulta GET.
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </section>
    </main>

    <script>
      const mensaje = document.querySelector("#mensaje");
      const tabla = document.querySelector("#tabla-componentes");
      const total = document.querySelector("#total");

      document
        .querySelector("#btn-listar")
        .addEventListener("click", async () => {
          await ejecutarGet(
            "/api/procesadores",
            (respuesta) => respuesta.procesadoresResponseDto,
          );
        });

      document
        .querySelector("#btn-obtener")
        .addEventListener("click", async () => {
          const id = Number(document.querySelector("#componente-id").value);
          await ejecutarGet(`/api/procesadores/${id}`, (respuesta) => [
            respuesta.procesadorResponseDto,
          ]);
        });

      async function ejecutarGet(ruta, extraerComponentes) {
        try {
          const respuestaHttp = await fetch(ruta);
          const respuesta = await respuestaHttp.json();
          if (!respuestaHttp.ok) {
            throw new Error(
              `HTTP ${respuestaHttp.status} · ${respuesta.mensaje}`,
            );
          }

          const componentes = extraerComponentes(respuesta);
          renderizar(componentes);
          mostrarMensaje(`HTTP ${respuestaHttp.status} · GET correcto`, true);
        } catch (error) {
          renderizar([]);
          mostrarMensaje(error.message, false);
        }
      }

      function renderizar(componentes) {
        total.textContent = `${componentes.length} componente(s)`;
        if (!componentes.length) {
          tabla.innerHTML =
            '<tr><td colspan="7" class="text-center text-secondary py-4">Sin resultados.</td></tr>';
          return;
        }

        tabla.innerHTML = componentes
          .map(
            (componente) => `
          <tr>
            <td>${componente.id}</td>
            <td>${componente.codigo}</td>
            <td>${componente.modelo}</td>
            <td>${componente.arquitectura}</td>
            <td>${componente.nucleos}</td>
            <td>S/ ${Number(componente.precio).toFixed(2)}</td>
            <td><span class="badge text-bg-${componente.registro ? "success" : "secondary"}">${componente.registro ? "Registrado" : "No registrado"}</span></td>
          </tr>
        `,
          )
          .join("");
      }

      function mostrarMensaje(texto, correcto) {
        mensaje.className = `alert alert-${correcto ? "success" : "danger"}`;
        mensaje.textContent = texto;
      }
    </script>
    <script src="/bootstrap/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
