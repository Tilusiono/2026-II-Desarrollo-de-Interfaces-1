<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Buscar componentes</title>
    <link rel="stylesheet" href="/bootstrap/css/bootstrap.min.css" />
    <link rel="stylesheet" href="/bootstrap-icons/font/bootstrap-icons.css" />
  </head>
  <body class="bg-light">
    <nav class="navbar navbar-dark bg-primary">
      <div class="container">
        <span class="navbar-brand"
          ><i class="bi bi-search me-2"></i>Buscar componentes</span
        >
      </div>
    </nav>

    <main class="container py-4">
      <div id="mensaje" class="alert d-none" role="alert"></div>
      <section class="card border-0 shadow-sm mb-4">
        <div class="card-body p-4">
          <form id="form-buscar" class="row g-3 align-items-end">
            <div class="col-md-4">
              <label class="form-label" for="texto">Texto</label>
              <div class="input-group">
                <span class="input-group-text"
                  ><i class="bi bi-search"></i
                ></span>
                <input
                  id="texto"
                  class="form-control"
                  placeholder="Código, modelo o descripción"
                />
              </div>
            </div>
            <div class="col-md-2">
              <label class="form-label" for="arquitectura">Arquitectura</label>
              <select id="arquitectura" class="form-select">
                <option value="">Todas</option>
                <option value="X64">x64</option>
                <option value="X86">x86</option>
                <option value="ARM">ARM</option>
                <option value="RSC">RISC</option>
              </select>
            </div>
            <div class="col-md-2">
              <label class="form-label" for="registro">Estado</label>
              <select id="registro" class="form-select">
                <option value="">Todos</option>
                <option value="true">Registrados</option>
                <option value="false">No registrados</option>
              </select>
            </div>
            <div class="col-md-2">
              <label class="form-label" for="precioMin">Precio mínimo</label>
              <input
                id="precioMin"
                type="number"
                min="0"
                class="form-control"
              />
            </div>
            <div class="col-md-2">
              <label class="form-label" for="precioMax">Precio máximo</label>
              <input
                id="precioMax"
                type="number"
                min="0"
                class="form-control"
              />
            </div>
            <div class="col-12">
              <button class="btn btn-primary">
                <i class="bi bi-funnel me-1"></i>Buscar con GET
              </button>
              <button
                id="btn-limpiar"
                type="button"
                class="btn btn-outline-secondary"
              >
                <i class="bi bi-x-circle me-1"></i>Limpiar filtros
              </button>
            </div>
          </form>
          <code id="url" class="d-block mt-3"></code>
        </div>
      </section>

      <section class="card border-0 shadow-sm">
        <div class="card-body p-4">
          <div class="d-flex justify-content-between mb-3">
            <h1 class="h5 mb-0">Resultados filtrados</h1>
            <span id="total" class="badge text-bg-primary">0</span>
          </div>
          <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
              <thead>
                <tr>
                  <th>ID</th>
                  <th>Código</th>
                  <th>Modelo</th>
                  <th>Arquitectura</th>
                  <th>Precio</th>
                  <th>Estado</th>
                </tr>
              </thead>
              <tbody id="tabla">
                <tr>
                  <td colspan="6" class="text-center py-4 text-secondary">
                    Realiza una búsqueda.
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </section>
    </main>

    <script>
      const formulario = document.querySelector("#form-buscar");
      const mensaje = document.querySelector("#mensaje");
      const tabla = document.querySelector("#tabla");

      formulario.addEventListener("submit", buscar);
      document.querySelector("#btn-limpiar").addEventListener("click", () => {
        formulario.reset();
        buscar(new Event("submit"));
      });

      async function buscar(evento) {
        evento.preventDefault();
        const consultaDto = {
          texto: valor("texto"),
          arquitectura: valor("arquitectura"),
          registro: valor("registro"),
          precioMin: valor("precioMin"),
          precioMax: valor("precioMax"),
        };
        const parametros = new URLSearchParams();
        for (const [campo, valorActual] of Object.entries(
          consultaDto,
        )) {
          if (valorActual !== "") parametros.set(campo, valorActual);
        }
        const ruta = `/api/procesadores/buscar?${parametros}`;
        document.querySelector("#url").textContent = `GET ${ruta}`;

        try {
          const respuestaHttp = await fetch(ruta);
          const respuesta = await respuestaHttp.json();
          if (!respuestaHttp.ok)
            throw new Error(
              `HTTP ${respuestaHttp.status} · ${respuesta.mensaje}`,
            );
          renderizar(respuesta.procesadoresResponseDto);
          mostrar(`HTTP 200 · ${respuesta.total} resultado(s)`, true);
        } catch (error) {
          renderizar([]);
          mostrar(error.message, false);
        }
      }

      function renderizar(procesadores) {
        document.querySelector("#total").textContent = procesadores.length;
        tabla.innerHTML = procesadores.length
          ? procesadores
              .map(
                (p) =>
                  `<tr><td>${p.id}</td><td>${p.codigo}</td><td>${p.modelo}</td><td>${p.arquitectura}</td><td>S/ ${Number(p.precio).toFixed(2)}</td><td>${p.registro ? "Registrado" : "No registrado"}</td></tr>`,
              )
              .join("")
          : '<tr><td colspan="6" class="text-center py-4 text-secondary">Sin resultados.</td></tr>';
      }
      function valor(id) {
        return document.querySelector(`#${id}`).value.trim();
      }
      function mostrar(texto, correcto) {
        mensaje.className = `alert alert-${correcto ? "success" : "danger"}`;
        mensaje.textContent = texto;
      }
    </script>
    <script src="/bootstrap/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
