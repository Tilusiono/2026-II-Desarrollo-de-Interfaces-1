<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hito 3 - Probar POST</title>
    <link rel="stylesheet" href="/bootstrap/css/bootstrap.min.css" />
    <link rel="stylesheet" href="/bootstrap-icons/font/bootstrap-icons.css" />
  </head>
  <body class="bg-light">
    <nav class="navbar navbar-dark bg-primary">
      <div class="container">
        <span class="navbar-brand">
          <i class="bi bi-plus-square me-2"></i>Hito 3 · POST
        </span>
      </div>
    </nav>

    <main class="container py-4">
      <div class="card border-0 shadow-sm">
        <div class="card-body p-4">
          <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
              <h1 class="h4 mb-1">Crear una tarjeta gráfica</h1>
              <p class="text-secondary mb-0">POST /api/tarjetas-graficas</p>
            </div>
            <span class="badge text-bg-primary">Frontend temporal</span>
          </div>

          <form id="form-post" class="row g-3">
            <div class="col-md-4">
              <label class="form-label" for="codigo">Código</label>
              <input
                id="codigo"
                class="form-control"
                value="GPU-WEB-001"
                required
              />
            </div>
            <div class="col-md-5">
              <label class="form-label" for="modelo">Modelo</label>
              <input
                id="modelo"
                class="form-control"
                value="NVIDIA GeForce RTX 4060"
                required
              />
            </div>
            <div class="col-md-3">
              <label class="form-label" for="fabricante">Fabricante</label>
              <select id="fabricante" class="form-select" required>
                <option value="NVD">NVIDIA</option>
                <option value="AMD">AMD</option>
                <option value="INT">Intel</option>
                <option value="OTH">Otros</option>
              </select>
            </div>
            <div class="col-md-3">
              <label class="form-label" for="memoriaGb">Memoria GB</label>
              <input
                id="memoriaGb"
                type="number"
                min="0"
                class="form-control"
                value="8"
                required
              />
            </div>
            <div class="col-md-3">
              <label class="form-label" for="precio">Precio</label>
              <input
                id="precio"
                type="number"
                min="0"
                step="0.01"
                class="form-control"
                value="1499.90"
                required
              />
            </div>
            <div class="col-md-3">
              <label class="form-label" for="frecuenciaMhz"
                >Frecuencia MHz</label
              >
              <input
                id="frecuenciaMhz"
                type="number"
                min="0"
                step="0.01"
                class="form-control"
                value="2535"
              />
            </div>
            <div class="col-md-3">
              <label class="form-label" for="fechaLanzamiento"
                >Fecha de lanzamiento</label
              >
              <input id="fechaLanzamiento" type="date" class="form-control" />
            </div>
            <div class="col-md-3">
              <label class="form-label" for="horaRegistro">Hora</label>
              <input
                id="horaRegistro"
                type="time"
                class="form-control"
                value="09:30"
                required
              />
            </div>
            <div class="col-md-4">
              <label class="form-label" for="fechaHoraRegistro"
                >Fecha y hora</label
              >
              <input
                id="fechaHoraRegistro"
                type="datetime-local"
                class="form-control"
                value="2026-08-03T09:30"
                required
              />
            </div>
            <div class="col-md-5">
              <label class="form-label" for="imagen">Imagen opcional</label>
              <input
                id="imagen"
                type="file"
                accept="image/*"
                class="form-control"
              />
            </div>
            <div class="col-md-3 d-flex align-items-end">
              <div class="form-check form-switch mb-2">
                <input
                  id="registro"
                  class="form-check-input"
                  type="checkbox"
                  checked
                />
                <label class="form-check-label" for="registro"
                  >Registrado</label
                >
              </div>
            </div>
            <div class="col-12">
              <label class="form-label" for="descripcion">Descripción</label>
              <textarea id="descripcion" class="form-control" rows="2">
Creado desde el frontend del hito POST</textarea>
            </div>
            <div class="col-12">
              <button class="btn btn-primary">
                <i class="bi bi-cloud-arrow-up me-1"></i>Enviar POST
              </button>
            </div>
          </form>

          <div id="mensaje" class="alert d-none mt-4" role="alert"></div>
          <pre
            id="resultado"
            class="bg-dark text-light rounded p-3 mt-3 mb-0 d-none"
          ></pre>
        </div>
      </div>
    </main>

    <script>
      const formulario = document.querySelector("#form-post");
      const mensaje = document.querySelector("#mensaje");
      const resultado = document.querySelector("#resultado");

      formulario.addEventListener("submit", async (evento) => {
        evento.preventDefault();

        try {
          const archivo = document.querySelector("#imagen").files[0];
          const imagenBase64 = archivo ? await convertirBase64(archivo) : null;

          const tarjetaGraficaRequestDto = {
            codigo: document.querySelector("#codigo").value.trim(),
            modelo: document.querySelector("#modelo").value.trim(),
            fabricante: document.querySelector("#fabricante").value,
            memoriaGb: Number(document.querySelector("#memoriaGb").value),
            precio: Number(document.querySelector("#precio").value),
            frecuenciaMhz: valorNumeroONull("#frecuenciaMhz"),
            descripcion:
              document.querySelector("#descripcion").value.trim() || null,
            registro: document.querySelector("#registro").checked,
            fechaLanzamiento:
              document.querySelector("#fechaLanzamiento").value || null,
            horaRegistro: document.querySelector("#horaRegistro").value,
            fechaHoraRegistro:
              document.querySelector("#fechaHoraRegistro").value,
            imagenBase64,
          };

          const respuestaHttp = await fetch("/api/tarjetas-graficas", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(tarjetaGraficaRequestDto),
          });
          const respuesta = await respuestaHttp.json();

          mostrarResultado(respuestaHttp.status, respuestaHttp.ok, respuesta);
        } catch (error) {
          mostrarResultado(0, false, { mensaje: error.message });
        }
      });

      function valorNumeroONull(selector) {
        const valor = document.querySelector(selector).value;
        return valor === "" ? null : Number(valor);
      }

      function convertirBase64(archivo) {
        return new Promise((resolve, reject) => {
          const lector = new FileReader();
          lector.addEventListener("load", () => resolve(lector.result), {
            once: true,
          });
          lector.addEventListener("error", () => reject(lector.error), {
            once: true,
          });
          lector.readAsDataURL(archivo);
        });
      }

      function mostrarResultado(status, correcto, datos) {
        mensaje.className = `alert alert-${correcto ? "success" : "danger"} mt-4`;
        mensaje.textContent = `HTTP ${status || "sin respuesta"} · ${datos.mensaje ?? "Solicitud procesada"}`;
        resultado.textContent = JSON.stringify(datos, null, 2);
        resultado.classList.remove("d-none");
      }
    </script>
    <script src="/bootstrap/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
