<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cargos - Gestión HR</title>
    <link rel="stylesheet" href="/bootstrap/css/bootstrap.min.css" />
    <link rel="stylesheet" href="/bootstrap-icons/font/bootstrap-icons.css" />
    <link rel="stylesheet" href="/css/estilos.css" />
  </head>
  <body class="bg-light">
    
    <!-- BARRA DE NAVEGACIÓN -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
      <div class="container">
        <a class="navbar-brand mb-0 h1" href="/index.html">
          <i class="bi bi-building-fill me-2"></i>Gestión HR
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuNavegacion">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="menuNavegacion">
          <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
            <li class="nav-item"><a class="nav-link" href="/index.html"><i class="bi bi-house-door me-1"></i>Inicio</a></li>
            <li class="nav-item"><a class="nav-link" href="/pages/Empleados.html"><i class="bi bi-people me-1"></i>Empleados</a></li>
            <li class="nav-item"><a class="nav-link" href="/pages/Areas.html"><i class="bi bi-diagram-3 me-1"></i>Áreas</a></li>
            <li class="nav-item"><a class="nav-link active" href="/pages/Cargos.html"><i class="bi bi-file-earmark-post me-1"></i>Cargo</a></li>
            <li class="nav-item"><a class="nav-link" href="/pages/Sedes.html"><i class="bi bi-house-add me-1"></i>Sedes</a></li>
            <li class="nav-item"><a class="nav-link" href="/pages/Permisos.html"><i class="bi bi-device-ssd me-1"></i>Permisos</a></li>
            <li class="nav-item"><a class="nav-link" href="/pages/Asistencias.html"><i class="bi bi-archive me-1"></i>Asistencias</a></li>
            <li class="nav-item"><a class="nav-link" href="/pages/Vacaciones.html"><i class="bi bi-calendar-check me-1"></i>Vacaciones</a></li>
          </ul>
        </div>
      </div>
    </nav>

    <main class="container py-4">
      
      <!--  FORMULARIO Crear  Editar  -->
      <div class="card border-0 shadow-sm mb-4">
        <div class="card-body p-4">
          <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
              <h1 id="titulo-formulario" class="h4 mb-1 text-primary"><i class="bi bi-plus-square-fill me-2"></i>Registrar Nuevo Cargo</h1>
            </div>
          </div>

          <form id="form-cargo" class="row g-3">
            <!-- CAMPO OCULTO para el ID al editar -->
            <input type="hidden" id="idCargoEditar" value="" />

            <div class="col-md-4">
              <label class="form-label" for="nombre">Nombre del Cargo</label>
              <input id="nombre" type="text" class="form-control" placeholder="Ej: Analista de Sistemas" required />
            </div>
            
            <div class="col-md-8">
              <label class="form-label" for="descripcion">Descripción</label>
              <input id="descripcion" type="text" class="form-control" placeholder="Breve descripción de las funciones..." required />
            </div>

            <!-- BOTONES DEL FORMULARIO -->
            <div class="col-12 mt-4 d-flex gap-2">
              <button type="submit" id="btn-guardar" class="btn btn-primary">
                <i class="bi bi-save me-1"></i>Guardar Cargo
              </button>
              <button type="button" id="btn-cancelar" class="btn btn-secondary d-none" onclick="cancelarEdicion()">
                Cancelar Edición
              </button>
            </div>
          </form>

          <div id="mensaje" class="alert d-none mt-3 mb-0" role="alert"></div>
        </div>
      </div>

      <!-- TABLA DE DATOS -->
      <div class="card border-0 shadow-sm">
        <div class="card-body p-0">
          <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
              <thead class="table-light">
                <tr>
                  <th width="10%">ID</th>
                  <th width="30%">Nombre del Cargo</th>
                  <th width="45%">Descripción</th>
                  <th width="15%" class="text-center">Acciones</th>
                </tr>
              </thead>
              <tbody id="tabla-cargos">
                <tr><td colspan="4" class="text-center py-4">Cargando datos...</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </main>

    <!-- SCRIPT DE LÓGICA -->
    <script>
      const formulario = document.querySelector("#form-cargo");
      const mensaje = document.querySelector("#mensaje");
      const tbody = document.querySelector("#tabla-cargos");
      
      let listaGlobalCargos = [];

      // Inicializar
      document.addEventListener("DOMContentLoaded", cargarTablaCargos);

      // GET - Cargar Cargos
      async function cargarTablaCargos() {
        try {
          const respuesta = await fetch("/api/cargos");
          const datos = await respuesta.json();
          // Dependiendo de tu DTO, puede venir directo o dentro de una propiedad
          listaGlobalCargos = datos.cargosResponseDto || datos || [];
          dibujarTabla();
        } catch (error) {
          tbody.innerHTML = `<tr><td colspan="4" class="text-center text-danger py-4">Error al cargar la tabla</td></tr>`;
        }
      }

      function dibujarTabla() {
        if (listaGlobalCargos.length === 0) {
          tbody.innerHTML = `<tr><td colspan="4" class="text-center py-4 text-secondary">No hay cargos registrados.</td></tr>`;
          return;
        }

        tbody.innerHTML = listaGlobalCargos.map(cargo => `
          <tr>
            <td>${cargo.idCargo}</td>
            <td><strong>${cargo.nombre}</strong></td>
            <td>${cargo.descripcion || '-'}</td>
            <td class="text-center">
              <button class="btn btn-sm btn-outline-primary me-1" onclick="prepararEdicion(${cargo.idCargo})" title="Editar">
                <i class="bi bi-pencil"></i>
              </button>
              <button class="btn btn-sm btn-outline-danger" onclick="eliminarCargo(${cargo.idCargo})" title="Eliminar">
                <i class="bi bi-trash"></i>
              </button>
            </td>
          </tr>
        `).join('');
      }

      // POST / PUT r
      formulario.addEventListener("submit", async (evento) => {
        evento.preventDefault();

        const datosFormulario = {
          nombre: document.querySelector("#nombre").value.trim(),
          descripcion: document.querySelector("#descripcion").value.trim()
        };

        const idAEditar = document.querySelector("#idCargoEditar").value;
        const metodoHttp = idAEditar ? "PUT" : "POST";
        const urlApi = idAEditar ? `/api/cargos/${idAEditar}` : "/api/cargos";

        try {
          const respuestaHttp = await fetch(urlApi, {
            method: metodoHttp,
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(datosFormulario),
          });
          
          if (!respuestaHttp.ok) throw new Error("Error al guardar el cargo.");

          mostrarMensaje(idAEditar ? "¡Cargo actualizado correctamente!" : "¡Cargo registrado con éxito!", true);
          
          cancelarEdicion(); 
          cargarTablaCargos();
          
        } catch (error) {
          mostrarMensaje(error.message, false);
        }
      });

      // Preparar Edición
      function prepararEdicion(idCargo) {
        const cargo = listaGlobalCargos.find(c => c.idCargo === idCargo);
        if (!cargo) return;

        document.querySelector("#idCargoEditar").value = cargo.idCargo;
        document.querySelector("#nombre").value = cargo.nombre;
        document.querySelector("#descripcion").value = cargo.descripcion || "";

        document.querySelector("#titulo-formulario").innerHTML = `<i class="bi bi-pencil-square me-2"></i>Editando Cargo: ${cargo.nombre}`;
        document.querySelector("#titulo-formulario").classList.replace("text-primary", "text-success");
        
        const btnGuardar = document.querySelector("#btn-guardar");
        btnGuardar.innerHTML = '<i class="bi bi-arrow-repeat me-1"></i>Actualizar Cargo';
        btnGuardar.classList.replace("btn-primary", "btn-success");
        
        document.querySelector("#btn-cancelar").classList.remove("d-none");
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }

      // Cancelar Edición
      function cancelarEdicion() {
        formulario.reset();
        document.querySelector("#idCargoEditar").value = "";
        
        document.querySelector("#titulo-formulario").innerHTML = `<i class="bi bi-plus-square-fill me-2"></i>Registrar Nuevo Cargo`;
        document.querySelector("#titulo-formulario").classList.replace("text-success", "text-primary");

        const btnGuardar = document.querySelector("#btn-guardar");
        btnGuardar.innerHTML = '<i class="bi bi-save me-1"></i>Guardar Cargo';
        btnGuardar.classList.replace("btn-success", "btn-primary");
        
        document.querySelector("#btn-cancelar").classList.add("d-none");
      }

      // DELETE - Eliminar Cargo
      async function eliminarCargo(idCargo) {
        if (!confirm(`¿Estás seguro de que deseas eliminar el cargo con ID ${idCargo}?`)) return;

        try {
          const respuesta = await fetch(`/api/cargos/${idCargo}`, { method: "DELETE" });
          if (!respuesta.ok) throw new Error("No se pudo eliminar el cargo. Puede que haya empleados asignados a él.");
          
          mostrarMensaje("Cargo eliminado correctamente", true);
          cargarTablaCargos();
        } catch (error) {
          mostrarMensaje(error.message, false);
        }
      }

      // Mensajes flotantes
      function mostrarMensaje(texto, esExito) {
        mensaje.className = `alert alert-${esExito ? "success" : "danger"} mt-3`;
        mensaje.textContent = texto;
        mensaje.classList.remove("d-none");
        setTimeout(() => mensaje.classList.add("d-none"), 3000);
      }
    </script>
    <script src="/bootstrap/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
