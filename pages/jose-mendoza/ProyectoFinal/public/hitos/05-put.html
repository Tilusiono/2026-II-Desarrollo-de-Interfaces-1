<!doctype html><html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hito 5 - Probar PUT Empleados</title>
    <link rel="stylesheet" href="/bootstrap/css/bootstrap.min.css" />
    <link rel="stylesheet" href="/bootstrap-icons/font/bootstrap-icons.css" />
  </head>
  <body class="bg-light">
    <nav class="navbar navbar-dark bg-primary">
      <div class="container">
        <span class="navbar-brand"><i class="bi bi-pencil-square me-2"></i>Hito 5 · PUT Empleados</span>
      </div>
    </nav>

    <main class="container py-4">
      <div id="mensaje" class="alert d-none" role="alert"></div>
      <section class="card border-0 shadow-sm">
        <div class="card-body p-4">
          <div class="row g-3 align-items-end mb-4">
            <div class="col-md-4">
              <label class="form-label" for="id">ID del empleado a reemplazar</label>
              <input id="id" type="number" min="1" value="1" class="form-control" />
            </div>
            <div class="col-md-4">
              <button id="btn-cargar" type="button" class="btn btn-outline-primary w-100">
                <i class="bi bi-download me-1"></i>Cargar datos con GET
              </button>
            </div>
          </div>

          <form id="form-put" class="row g-3">
            <div class="col-md-4">
              <label class="form-label" for="dni">DNI</label>
              <input id="dni" maxlength="8" class="form-control" required />
            </div>
            <div class="col-md-4">
              <label class="form-label" for="nombres">Nombres</label>
              <input id="nombres" class="form-control" required />
            </div>
            <div class="col-md-4">
              <label class="form-label" for="apellidos">Apellidos</label>
              <input id="apellidos" class="form-control" required />
            </div>
            <div class="col-md-4">
              <label class="form-label" for="telefono">Teléfono</label>
              <input id="telefono" class="form-control" />
            </div>
            <div class="col-md-4">
              <label class="form-label" for="correo">Correo</label>
              <input id="correo" type="email" class="form-control" />
            </div>
            <div class="col-md-4">
              <label class="form-label" for="direccion">Dirección</label>
              <input id="direccion" class="form-control" />
            </div>
            <div class="col-md-3">
              <label class="form-label" for="fechaIngreso">Fecha de Ingreso</label>
              <input id="fechaIngreso" type="date" class="form-control" required />
            </div>
            <div class="col-md-3">
              <label class="form-label" for="salario">Salario</label>
              <input id="salario" type="number" min="0" step="0.01" class="form-control" required />
            </div>
            <div class="col-md-3">
              <label class="form-label" for="idTipoEmpleado">ID Tipo Empleado</label>
              <input id="idTipoEmpleado" type="number" min="1" class="form-control" required />
            </div>
            <div class="col-md-3">
              <label class="form-label" for="idCargo">ID Cargo</label>
              <input id="idCargo" type="number" min="1" class="form-control" required />
            </div>
            <div class="col-md-3">
              <label class="form-label" for="idArea">ID Área</label>
              <input id="idArea" type="number" min="1" class="form-control" required />
            </div>
            <div class="col-md-3">
              <label class="form-label" for="idSede">ID Sede</label>
              <input id="idSede" type="number" min="1" class="form-control" required />
            </div>
            <div class="col-md-3 d-flex align-items-end">
              <div class="form-check form-switch mb-2">
                <input id="estado" class="form-check-input" type="checkbox" />
                <label class="form-check-label" for="estado">Activo</label>
              </div>
            </div>
            <div class="col-12">
              <button class="btn btn-primary">
                <i class="bi bi-save me-1"></i>Reemplazar todos los campos con PUT
              </button>
            </div>
          </form>
          <pre id="resultado" class="bg-dark text-light rounded p-3 mt-4 mb-0 d-none"></pre>
        </div>
      </section>
    </main>

    <script>
      const mensaje = document.querySelector("#mensaje");
      const resultado = document.querySelector("#resultado");

      document.querySelector("#btn-cargar").addEventListener("click", cargarEmpleado);
      document.querySelector("#form-put").addEventListener("submit", reemplazarEmpleado);

      async function cargarEmpleado() {
        const id = Number(document.querySelector("#id").value);
        await ejecutar(async () => {
          const respuestaHttp = await fetch(`/api/empleados/${id}`);
          const respuesta = await respuestaHttp.json();
          if (!respuestaHttp.ok) throw new Error(`HTTP ${respuestaHttp.status} · ${respuesta.mensaje}`);

          const emp = respuesta.empleadoResponseDto;
          for (const campo of ["dni", "nombres", "apellidos", "telefono", "correo", "direccion", "fechaIngreso", "salario", "idTipoEmpleado", "idCargo", "idArea", "idSede"]) {
            document.querySelector(`#${campo}`).value = emp[campo] ?? "";
          }
          document.querySelector("#estado").checked = emp.estado === 1 || emp.estado === "Activo";
          mostrar(`HTTP 200 · Empleado ${id} cargado. Modifica cualquier campo.`, true);
        });
      }

      async function reemplazarEmpleado(evento) {
        evento.preventDefault();
        const id = Number(document.querySelector("#id").value);

        await ejecutar(async () => {
          const empleadoRequestDto = {
            dni: valor("dni"),
            nombres: valor("nombres"),
            apellidos: valor("apellidos"),
            telefono: valor("telefono") || null,
            correo: valor("correo") || null,
            direccion: valor("direccion") || null,
            fechaIngreso: valor("fechaIngreso"),
            salario: Number(valor("salario")),
            estado: document.querySelector("#estado").checked ? "Activo" : "Inactivo",
            idTipoEmpleado: Number(valor("idTipoEmpleado")),
            idCargo: Number(valor("idCargo")),
            idArea: Number(valor("idArea")),
            idSede: Number(valor("idSede")),
          };

          const respuestaHttp = await fetch(`/api/empleados/${id}`, {
            method: "PUT",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(empleadoRequestDto),
          });
          const respuesta = await respuestaHttp.json();
          resultado.textContent = JSON.stringify(respuesta, null, 2);
          resultado.classList.remove("d-none");
          if (!respuestaHttp.ok) throw new Error(`HTTP ${respuestaHttp.status} · ${respuesta.mensaje}`);
          mostrar(`HTTP ${respuestaHttp.status} · ${respuesta.mensaje}`, true);
        });
      }

      function valor(id) { return document.querySelector(`#${id}`).value.trim(); }
      async function ejecutar(callback) {
        try { await callback(); } catch (error) { mostrar(error.message, false); }
      }
      function mostrar(texto, correcto) {
        mensaje.className = `alert alert-${correcto ? "success" : "danger"}`;
        mensaje.textContent = texto;
      }
    </script>
    <script src="/bootstrap/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
