<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hito 8 - Probar QUERY Empleados</title>
    <link rel="stylesheet" href="/bootstrap/css/bootstrap.min.css" />
    <link rel="stylesheet" href="/bootstrap-icons/font/bootstrap-icons.css" />
  </head>
  <body class="bg-light">
    <nav class="navbar navbar-dark bg-primary">
      <div class="container">
        <span class="navbar-brand"><i class="bi bi-database-down me-2"></i>Hito 8 · Empleados QUERY</span>
      </div>
    </nav>

    <main class="container py-4">
      <div class="alert alert-info">
        <i class="bi bi-info-circle me-1"></i>
        `QUERY` es un método HTTP personalizado para consultar empleados mediante parámetros en la URL.
      </div>
      <div id="mensaje" class="alert d-none" role="alert"></div>

      <section class="card border-0 shadow-sm mb-4">
        <div class="card-body p-4">
          <form id="form-query" class="row g-3 align-items-end">
            <div class="col-md-3">
              <label class="form-label" for="texto">Texto (DNI, Nombres, Apellidos, etc.)</label>
              <input id="texto" class="form-control" />
            </div>
            <div class="col-md-2">
              <label class="form-label" for="estado">Estado</label>
              <select id="estado" class="form-select">
                <option value="">Todos</option>
                <option value="1">Activo</option>
                <option value="0">Inactivo</option>
              </select>
            </div>
            <div class="col-md-2">
              <label class="form-label" for="idTipoEmpleado">ID Tipo Empleado</label>
              <input id="idTipoEmpleado" type="number" class="form-control" />
            </div>
            <div class="col-md-2">
              <label class="form-label" for="idCargo">ID Cargo</label>
              <input id="idCargo" type="number" class="form-control" />
            </div>
            <div class="col-md-3">
              <label class="form-label" for="idArea">ID Área</label>
              <input id="idArea" type="number" class="form-control" />
            </div>
            <div class="col-12 d-flex flex-wrap gap-2 mt-3">
              <button class="btn btn-primary">
                <i class="bi bi-play-circle me-1"></i>Enviar método QUERY
              </button>
              <button id="btn-get-invalido" type="button" class="btn btn-outline-danger">
                <i class="bi bi-bug me-1"></i>Probar GET inválido
              </button>
            </div>
          </form>
          <code id="solicitud" class="d-block mt-3"></code>
        </div>
      </section>

      <section class="card border-0 shadow-sm">
        <div class="card-body p-4">
          <h1 class="h5">Respuesta</h1>
          <pre id="resultado" class="bg-dark text-light rounded p-3 mb-0">Ejecuta una solicitud.</pre>
        </div>
      </section>
    </main>

    <script>
      const formulario = document.querySelector("#form-query");
      const mensaje = document.querySelector("#mensaje");
      const resultado = document.querySelector("#resultado");

      formulario.addEventListener("submit", async (evento) => {
        evento.preventDefault();
        await consultar("QUERY");
      });
      document.querySelector("#btn-get-invalido").addEventListener("click", async () => {
        await consultar("GET");
      });

      async function consultar(metodo) {
        const parametros = new URLSearchParams();
        for (const identificador of ["texto", "estado", "idTipoEmpleado", "idCargo", "idArea"]) {
          const valor = document.querySelector(`#${identificador}`).value.trim();
          if (valor !== "") parametros.set(identificador, valor);
        }
        const ruta = `/api/empleados/consulta?${parametros}`;
        document.querySelector("#solicitud").textContent = `${metodo} ${ruta}`;

        try {
          const respuestaHttp = await fetch(ruta, { method: metodo });
          const respuesta = await respuestaHttp.json();
          resultado.textContent = JSON.stringify(respuesta, null, 2);

          const resultadoEsperado = metodo === "QUERY"
            ? respuestaHttp.status === 200 && respuesta.metodo === "QUERY"
            : respuestaHttp.status === 405;
          mostrar(
            `HTTP ${respuestaHttp.status} · ${resultadoEsperado ? "Resultado esperado" : "Resultado inesperado"}`,
            resultadoEsperado,
          );
        } catch (error) {
          mostrar(error.message, false);
        }
      }

      function mostrar(texto, correcto) {
        mensaje.className = `alert alert-${correcto ? "success" : "danger"}`;
        mensaje.textContent = texto;
      }
    </script>
    <script src="/bootstrap/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
