<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hito 4 - GET Periféricos</title>
    <link rel="stylesheet" href="/bootstrap/css/bootstrap.min.css" />
    <link rel="stylesheet" href="/bootstrap-icons/font/bootstrap-icons.css" />
    <style>
      /* Toques azules personalizados para diferenciarlo */
      .navbar-custom { background-color: #0a3d6e !important; }
      .card-custom { border-top: 4px solid #0a3d6e; }
    </style>
  </head>
  <body class="bg-primary-subtle">
    <nav class="navbar navbar-dark navbar-custom shadow-sm">
      <div class="container">
        <span class="navbar-brand">
          <i class="bi bi-download me-2"></i>Hito 4 · GET Periféricos
        </span>
      </div>
    </nav>

    <main class="container py-4">
      <div id="mensaje" class="alert d-none" role="alert"></div>

      <section class="card card-custom border-0 shadow-sm mb-4">
        <div class="card-body p-4">
          <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
              <h1 class="h4 text-primary-emphasis mb-1">Probar las dos rutas GET</h1>
              <p class="text-secondary mb-0">Listar todos o buscar por ID</p>
            </div>
            <span class="badge bg-primary">Proyecto Gabriel</span>
          </div>
          
          <div class="row g-3 align-items-end">
            <div class="col-md-4">
              <button id="btn-listar" class="btn btn-primary w-100 fw-bold">
                <i class="bi bi-list-ul me-1"></i>GET: listar todos
              </button>
            </div>
            <div class="col-md-4">
              <label class="form-label fw-bold text-primary-emphasis" for="periferico-id">ID del periférico</label>
              <input id="periferico-id" type="number" min="1" value="1" class="form-control" />
            </div>
            <div class="col-md-4">
              <button id="btn-obtener" class="btn btn-outline-primary w-100 fw-bold">
                <i class="bi bi-search me-1"></i>GET: obtener por ID
              </button>
            </div>
          </div>
        </div>
      </section>

      <section class="card card-custom border-0 shadow-sm">
        <div class="card-body p-4">
          <div class="d-flex justify-content-between align-items-center mb-3">
            <h2 class="h5 text-primary-emphasis mb-0">Resultado</h2>
            <span id="total" class="badge text-bg-secondary">0 periférico(s)</span>
          </div>
          <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
              <thead class="table-light">
                <tr>
                  <th>ID</th>
                  <th>Código</th>
                  <th>Tipo</th>
                  <th>Marca</th>
                  <th>Modelo</th>
                  <th>Conexión</th>
                  <th>Stock</th>
                  <th>Precio</th>
                </tr>
              </thead>
              <tbody id="tabla-perifericos">
                <tr><td colspan="8" class="text-center text-secondary py-4">Ejecuta una consulta GET.</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </section>
    </main>

    <script>
      const mensaje = document.querySelector("#mensaje");
      const tabla = document.querySelector("#tabla-perifericos");
      const total = document.querySelector("#total");

      document.querySelector("#btn-listar").addEventListener("click", async () => {
        // Asumiendo que tu backend devuelve la lista en una propiedad llamada perifericosResponseDto
        await ejecutarGet("/api/perifericos", (respuesta) => respuesta.perifericosResponseDto || respuesta);
      });

      document.querySelector("#btn-obtener").addEventListener("click", async () => {
        const id = Number(document.querySelector("#periferico-id").value);
        // Asumiendo que tu backend devuelve el objeto en una propiedad llamada perifericosResponseDto
        await ejecutarGet(`/api/perifericos/${id}`, (respuesta) => {
            const dato = respuesta.perifericosResponseDto || respuesta;
            return Array.isArray(dato) ? dato : [dato];
        });
      });

      async function ejecutarGet(ruta, extraerPerifericos) {
        try {
          const respuestaHttp = await fetch(ruta);
          const respuesta = await respuestaHttp.json();
          if (!respuestaHttp.ok) {
            throw new Error(`HTTP ${respuestaHttp.status} · ${respuesta.mensaje || "Error al obtener datos"}`);
          }

          const perifericos = extraerPerifericos(respuesta);
          renderizar(perifericos);
          mostrarMensaje(`HTTP ${respuestaHttp.status} · GET correcto`, true);
        } catch (error) {
          renderizar([]);
          mostrarMensaje(error.message, false);
        }
      }

      function renderizar(perifericos) {
        // Aseguramos que siempre sea un array para iterar
        const lista = Array.isArray(perifericos) ? perifericos : [];
        total.textContent = `${lista.length} periférico(s)`;
        
        if (!lista.length) {
          tabla.innerHTML = '<tr><td colspan="8" class="text-center text-secondary py-4">Sin resultados.</td></tr>';
          return;
        }

        tabla.innerHTML = lista.map((p) => `
          <tr>
            <td><strong>${p.id}</strong></td>
            <td><span class="badge bg-secondary">${p.codigo}</span></td>
            <td>${p.tipo}</td>
            <td>${p.marca}</td>
            <td>${p.modelo}</td>
            <td>${p.tipoConexion}</td>
            <td>${p.stock}</td>
            <td class="text-success fw-bold">S/ ${Number(p.precio).toFixed(2)}</td>
          </tr>
        `).join("");
      }

      function mostrarMensaje(texto, correcto) {
        mensaje.classList.remove("d-none");
        mensaje.className = `alert alert-${correcto ? "success" : "danger"} mb-4`;
        mensaje.textContent = texto;
      }
    </script>
    <script src="/bootstrap/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
